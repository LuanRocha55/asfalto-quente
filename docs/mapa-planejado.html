  const dot=(col,n)=>(x,yy)=>{g.fillStyle=col;g.beginPath();g.arc(x,yy,10,0,7);g.fill();g.fillStyle='#fff';g.font='16px VT';g.textAlign='center';g.fillText(n,x,yy+5);g.textAlign='left';};
  head('LUGARES');
  const L=[['Casa da família (save, quadro)','Jacarandá'],['Estádio do Jacarandá','Jacarandá'],['Oficina do Zé (desmanche)','Jacarandá'],['Ponto da van pirata','Jacarandá'],
    ['Carceragem Central (o pai)','Centro'],['Casa de câmbio do Cabralzinho','Centro'],['Jornal e Foto 1 Hora','Centro'],['Camelódromo','Centro'],['Hospital','Centro'],
    ['Casa do Zeca do Rádio','Morro'],['Batalhão provisório','Morro'],['Boca da Turma do Alto','Morro'],
    ['Bingo Estrela','Barra Sul'],['DP da Barra Sul','Barra Sul'],['Stand "More no Paraíso"','Barra Sul'],
    ['Quiosque da família','Recanto'],['Colônia de pescadores','Pescadores'],['Sede da Firma (O Areal)','Pescadores'],['Galpão 7 (o dinheiro)','Cais']];
  const COLS=['#2a6f3a','#2a6f3a','#2a6f3a','#2a6f3a','#5a4a8a','#5a4a8a','#5a4a8a','#5a4a8a','#5a4a8a',CARIMBO,CARIMBO,CARIMBO,'#b0751c','#b0751c','#b0751c','#b0751c','#b0751c','rgba(30,45,120,1)','#b0751c'];
  L.forEach(([l,r],i)=>row(l,r,dot(COLS[i],i+1)));
  y+=12;head('LEGENDA');
  row('Via expressa e avenidas','',(x,yy)=>{g.fillStyle=TINTA;g.fillRect(x-12,yy-5,26,10);g.fillStyle=AV;g.fillRect(x-11,yy-3,24,6);});
  row('Túnel','',(x,yy)=>{g.strokeStyle=TINTA;g.setLineDash([5,4]);g.lineWidth=4;g.beginPath();g.moveTo(x-12,yy);g.lineTo(x+13,yy);g.stroke();g.setLineDash([]);});
  row('Escadaria (só a pé)','',(x,yy)=>{g.strokeStyle=TINTA;g.setLineDash([2,4]);g.lineWidth=3;g.beginPath();g.moveTo(x-12,yy);g.lineTo(x+13,yy);g.stroke();g.setLineDash([]);});
  row('Blitz da Operação Maré Alta','porta do capítulo',(x,yy)=>{g.fillStyle=CARIMBO;g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.moveTo(x,yy-9);g.lineTo(x+9,yy+7);g.lineTo(x-9,yy+7);g.closePath();g.fill();g.stroke();});
  row('Território da Turma do Alto','tráfico',(x,yy)=>{g.fillStyle='rgba(176,22,12,0.35)';for(let k=-12;k<12;k+=5)g.fillRect(x+k,yy-8,2,16);});
  row('Território da Firma','"segurança"',(x,yy)=>{g.fillStyle='rgba(40,60,140,0.5)';for(let k=-12;k<12;k+=5)g.fillRect(x+k,yy-8,2,16);});
  row('Trilha da Turma','atalho da facção',(x,yy)=>{g.strokeStyle=CARIMBO;g.setLineDash([6,4]);g.lineWidth=3;g.beginPath();g.moveTo(x-12,yy);g.lineTo(x+13,yy);g.stroke();g.setLineDash([]);});
  // carimbo
  stamp('RASCUNHO','plano, não está no jogo',0.8,0.945,-0.08,CARIMBO);
  document.title='ok';
}
